# Declares Netlify's Next.js runtime explicitly. Without it, a project
# whose framework isn't detected at creation gets .next published as plain
# static files and every page 404s (seen on the SmartPay trial deploy,
# 2026-10-15).
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
